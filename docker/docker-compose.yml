name: analisis-diario-de-acciones

# Definición de configuraciones reutilizables
x-comun: &comun
  build:
    context: .
    dockerfile: docker/Dockerfile
  restart: unless-stopped

  # Volúmenes para persistir datos, registros y reportes generados
  volumes:
    - datos_app:/app/data
    - registros_app:/app/logs
    - reportes_app:/app/reports
    - estrategias_app:/app/strategies:ro

  environment:
    # Zona horaria (Ajustada a Argentina)
    - TZ=America/Argentina/Buenos_Aires

    # Dirección IP de escucha del servidor interno
    - WEBUI_HOST=0.0.0.0

  # Configuración de rendimiento y límite de memoria
  deploy:
    resources:
      limits:
        memory: 1G      # Límite máximo de RAM
      reservations:
        memory: 512M    # Memoria RAM reservada mínima

# ==========================================
# SERVICIOS A EJECUTAR
# ==========================================
services:

  # 1. Servicio Analizador (Ejecuta la descarga, análisis de IA y envío de correo)
  analizador:
    <<: *comun
    container_name: analizador-acciones

  # 2. Servicio Servidor Web / API (Opcional: Si deseas consultar la interfaz visual)
  servidor-web:
    <<: *comun
    container_name: servidor-acciones
    command: ["python", "main.py", "--serve-only", "--host", "0.0.0.0", "--port", "${API_PORT:-8000}"]
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"

# ==========================================
# VOLÚMENES PERSISTENTES
# ==========================================
volumes:
  datos_app:
  registros_app:
  reportes_app:
  estrategias_app:
